name: Build RELIEF APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RELIEF source ZIP
        run: |
          test -f relief-source-code.zip
          unzip -q relief-source-code.zip -d .
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build debug APK with diagnostic log
        id: gradle_build
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee ../relief-build.log
          result=${PIPESTATUS[0]}
          echo "Gradle exit code: $result"
          echo "---- KEY ERROR LINES ----"
          grep -n -A 12 -B 5 -E 'What went wrong:|FAILURE:|Execution failed for|Could not resolve|Could not find| error:' ../relief-build.log | tail -n 100 || true
          exit "$result"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RELIEF-build-diagnostic-log
          path: relief-build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RELIEF-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
